name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B package
      - name: Flaky test report on the sample runs
        # The sample history has 2 flaky tests; allow 2 so the demo passes. In a real pipeline use --max-flaky 0.
        run: java -jar target/flaky-test-detector.jar sample-runs --max-flaky 2 --out report >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flaky-report
          path: report/
